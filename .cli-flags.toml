# This MCP service accepts environment configuration only, never CLI arguments.
# The shared flags-2-env audit requires at least one flag or command declaration.
# Reserve its conventional help spelling for schema validity; src/flags.rs rejects
# every supplied argument, including this recognized flag. It is never acted on.
[help]
url = "https://github.com/flags-2-env/flags-2-env-mcp-server.rs"

[env]
files = []

[parse]
allow_unknown = false

[flags.help]
aliases = ["help"]
env = "FLAGS_2_ENV_MCP_HELP"
type = "bool"
default = "false"

[package]
name = "flags-2-env-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
description = "Hardened read-only MCP server for the flags-2-env GitHub organization"
publish = false

[[bin]]
name = "flags-2-env-mcp-server"
path = "src/main.rs"

[[bin]]
name = "flags-2-env-mcp-http"
path = "src/http.rs"

[dependencies]
ore-mcp-org-server = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "f470ca5be6389bb20c2291acdfc3a382cb9b39b2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

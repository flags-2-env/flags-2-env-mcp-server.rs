protocol = "ores.lru-config.v1"
namespace = "flags-2-env-mcp-server"
roles = ["server"]

[redis]
urlEnv = "REDIS_URL"
keyPrefix = "ores:lru:v1:flags-2-env-mcp-server"
pubsubChannel = "ores:lru:v1:flags-2-env-mcp-server:events"
reconcileIntervalMs = 180000
reconnectMinMs = 1000
reconnectMaxMs = 30000

[defaults]
capacity = 512
syncMode = "read_only"
overflowMode = "reject_and_reconcile"
failOpenOnStartup = false

[[caches]]
name = "runtime-env"
role = "server"
